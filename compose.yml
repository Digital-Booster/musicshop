name: musicshop
services:
  web:
    build:
      context: .
    restart: unless-stopped
    ports:
      - 8080:8080
    volumes:
      - ./data:/data
    environment:
      - SPRING_PROFILES_ACTIVE=sqlite # Change this line to activate the right profile: postgres/sqlite
      - PSQL_IP=db
      - PSQL_USER=postgres
      - PSQL_PWD=postgres

  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: musicshop
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:

