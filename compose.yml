name: musicshop
services:
  web:
    build:
      context: .
    restart: always
    ports:
      - 8080:8080
    volumes:
      - ./data:/data
  db:
    image: postgres:18
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: musicshop
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:

