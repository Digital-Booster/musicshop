<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Manage Users - Music Shop</title>
    <style>
        body { font-family: Arial, Helvetica, sans-serif; background:#f6f6f6; }
        .container { width: 900px; margin:40px auto; background: #fff; padding:20px; box-shadow:0 2px 6px rgba(0,0,0,.1); }
        table { width:100%; border-collapse: collapse; }
        th, td { padding:8px; border-bottom:1px solid #eee; text-align:left; }
        .search { margin-bottom:12px; }
        a.button { padding:6px 10px; background:#eee; border-radius:4px; text-decoration:none; color:#333; }
    </style>
    </head>
<body>
<div class="container">
    <h2>Users</h2>

    <div th:if="${error}" style="color:#b00020;">[[${error}]]</div>
    <div th:if="${message}" style="color:#2e7d32;">[[${message}]]</div>

    <form th:action="@{/admin/users}" method="get" class="search">
        <input type="text" name="q" placeholder="Search by name or email" th:value="${q}" />
        <button type="submit">Search</button>
        <a th:href="@{/admin/users}" class="button">Reset</a>
    </form>

    <table>
        <thead>
            <tr><th>ID</th><th>Name</th><th>Email</th><th>Username</th><th>Actions</th></tr>
        </thead>
        <tbody>
            <tr th:each="u : ${users}">
                <td th:text="${u.userId}">1</td>
                <td th:text="${u.customer != null ? u.customer.firstName + ' ' + u.customer.lastName : ''}">Name</td>
                <td th:text="${u.customer != null ? u.customer.email : ''}">email</td>
                <td th:text="${u.username}">username</td>
                <td><a th:href="@{/admin/users/{id}(id=${u.userId})}">Edit</a></td>
            </tr>
        </tbody>
    </table>
</div>
</body>
</html>
