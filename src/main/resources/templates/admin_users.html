<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Manage Users - Music Shop</title>
    <link rel="stylesheet" th:href="@{/css/site.css}" />
    </head>
<body>
<div class="container large">
    <div th:replace="fragments/menu :: menu"></div>
    <h2>Users</h2>

    <div th:if="${error}" style="color:#b00020;">[[${error}]]</div>
    <div th:if="${message}" style="color:#2e7d32;">[[${message}]]</div>

    <form th:action="@{/admin/users}" method="get" class="search">
        <input type="text" name="q" placeholder="Search by name or email" th:value="${q}" />
        <button type="submit">Search</button>
        <a th:href="@{/admin/users}" class="button">Reset</a>
    </form>

    <table>
        <thead>
            <tr><th>ID</th><th>Name</th><th>Email</th><th>Username</th><th>Actions</th></tr>
        </thead>
        <tbody>
            <tr th:each="u : ${users}">
                <td th:text="${u.userId}">1</td>
                <td th:text="${u.customer != null ? u.customer.firstName + ' ' + u.customer.lastName : ''}">Name</td>
                <td th:text="${u.customer != null ? u.customer.email : ''}">email</td>
                <td th:text="${u.username}">username</td>
                <td>
                    <a th:href="@{/admin/users/{id}(id=${u.userId})}">Edit</a>
                    <span th:if="${u.customer != null}"> | <a th:href="@{/admin/invoices/customer/{cid}(cid=${u.customer.customerId})}">Invoices</a></span>
                </td>
            </tr>
        </tbody>
    </table>
</div>
</body>
</html>
