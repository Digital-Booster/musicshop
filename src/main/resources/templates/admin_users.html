<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manage Users - Music Shop</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/site.css}" />
</head>
<body class="d-flex flex-column min-vh-100">
    <div th:replace="~{fragments/menu :: menu}"></div>
    
    <div class="container flex-grow-1 py-4">
        <div class="content-card">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h1 class="h3 mb-0">
                    <i class="bi bi-people me-2"></i>Manage Users
                </h1>
                <!-- Add user button can be added here if needed -->
            </div>

            <div th:if="${error}" class="alert alert-danger d-flex align-items-center" role="alert">
                <i class="bi bi-exclamation-circle me-2"></i>
                <div th:text="${error}"></div>
            </div>
            <div th:if="${message}" class="alert alert-success d-flex align-items-center" role="alert">
                <i class="bi bi-check-circle me-2"></i>
                <div th:text="${message}"></div>
            </div>

            <div class="card mb-4">
                <div class="card-body">
                    <form th:action="@{/admin/users}" method="get" class="search-box">
                        <div class="input-group">
                            <span class="input-group-text">
                                <i class="bi bi-search"></i>
                            </span>
                            <input type="text" name="q" class="form-control" 
                                   placeholder="Search by name or email" th:value="${q}" />
                            <button type="submit" class="btn btn-primary">Search</button>
                            <a th:href="@{/admin/users}" class="btn btn-outline-secondary">
                                <i class="bi bi-x-circle me-1"></i>Reset
                            </a>
                        </div>
                    </form>
                </div>
            </div>

            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Username</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="u : ${users}">
                            <td th:text="${u.userId}">1</td>
                            <td th:text="${u.customer != null ? u.customer.firstName + ' ' + u.customer.lastName : '-'}">Name</td>
                            <td>
                                <span th:if="${u.customer != null}">
                                    <i class="bi bi-envelope me-1"></i>
                                    <span th:text="${u.customer.email}">email</span>
                                </span>
                                <span th:if="${u.customer == null}">-</span>
                            </td>
                            <td>
                                <i class="bi bi-person me-1"></i>
                                <span th:text="${u.username}">username</span>
                            </td>
                            <td>
                                <div class="btn-group">
                                    <a th:href="@{/admin/users/{id}(id=${u.userId})}" 
                                       class="btn btn-outline-primary btn-sm">
                                        <i class="bi bi-pencil me-1"></i>Edit
                                    </a>
                                    <a th:if="${u.customer != null}" 
                                       th:href="@{/admin/invoices/customer/{cid}(cid=${u.customer.customerId})}"
                                       class="btn btn-outline-info btn-sm">
                                        <i class="bi bi-receipt me-1"></i>Invoices
                                    </a>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
