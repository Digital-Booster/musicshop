<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Music Catalog - Music Shop</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/site.css}" />
</head>
<body class="d-flex flex-column min-vh-100">
    <div th:replace="~{fragments/menu :: menu}"></div>
    
    <div class="container flex-grow-1 py-4">
        <div class="content-card">
            <h1 class="h3 mb-4"><i class="bi bi-music-note-list me-2"></i>Music Catalog</h1>

            <!-- Filter Form -->
            <form th:action="@{/catalog}" method="get" class="row g-3 mb-4">
                <div class="col-md-3">
                    <label for="genreId" class="form-label">Genre</label>
                    <select id="genreId" name="genreId" class="form-select">
                        <option value="">All Genres</option>
                        <option th:each="genre : ${genres}" 
                                th:value="${genre.genreId}" 
                                th:text="${genre.name}"
                                th:selected="${selectedGenre != null && genre.genreId.equals(selectedGenre)}">
                        </option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label for="artistId" class="form-label">Artist</label>
                    <select id="artistId" name="artistId" class="form-select">
                        <option value="">All Artists</option>
                        <option th:each="artist : ${artists}" 
                                th:value="${artist.artistId}" 
                                th:text="${artist.name}"
                                th:selected="${selectedArtist != null && artist.artistId.equals(selectedArtist)}">
                        </option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label for="albumId" class="form-label">Album</label>
                    <select id="albumId" name="albumId" class="form-select">
                        <option value="">All Albums</option>
                        <option th:each="album : ${albums}" 
                                th:value="${album.albumId}" 
                                th:text="${album.title}"
                                th:selected="${selectedAlbum != null && album.albumId.equals(selectedAlbum)}">
                        </option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label for="trackName" class="form-label">Track Name</label>
                    <input type="text" id="trackName" name="trackName" class="form-control" th:value="${selectedTrackName}" placeholder="Enter track name...">
                </div>
                <div class="col-12">
                    <button type="submit" class="btn btn-primary"><i class="bi bi-search me-2"></i>Filter</button>
                    <a th:href="@{/catalog}" class="btn btn-secondary"><i class="bi bi-arrow-clockwise me-2"></i>Reset</a>
                </div>
            </form>

            <div th:if="${error}" class="alert alert-danger d-flex align-items-center" role="alert">
                <i class="bi bi-exclamation-circle me-2"></i>
                <div th:text="${error}"></div>
            </div>
            <div th:if="${message}" class="alert alert-success d-flex align-items-center" role="alert">
                <i class="bi bi-check-circle me-2"></i>
                <div th:text="${message}"></div>
            </div>

            <!-- Track List -->
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>Track</th>
                            <th>Album</th>
                            <th>Artist</th>
                            <th>Genre</th>
                            <th class="text-end">Price</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="track : ${tracks}">
                            <td>
                                <i class="bi bi-music-note me-2"></i>
                                <span th:text="${track.name}">Track Name</span>
                            </td>
                            <td>
                                <i class="bi bi-disc me-2"></i>
                                <span th:text="${track.album != null ? track.album.title : 'Unknown'}">Album Title</span>
                            </td>
                            <td>
                                <i class="bi bi-person me-2"></i>
                                <span th:text="${track.album != null && track.album.artist != null ? track.album.artist.name : 'Unknown'}">Artist Name</span>
                            </td>
                            <td>
                                <i class="bi bi-tag me-2"></i>
                                <span th:text="${track.genre != null ? track.genre.name : 'Unknown'}">Genre</span>
                            </td>
                            <td class="text-end" th:text="'$' + ${track.unitPrice}">0.00</td>
                            <td class="text-end" sec:authorize="hasRole('USER')">
                                <form th:action="@{/cart/add}" method="post">
                                    <input type="hidden" name="trackId" th:value="${track.trackId}" />
                                    <button type="submit" class="btn btn-sm btn-success">
                                        <i class="bi bi-cart-plus me-2"></i>
                                    </button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
             <div th:if="${tracks == null or #lists.isEmpty(tracks)}" class="text-center py-5">
                <i class="bi bi-search display-1 text-muted"></i>
                <p class="lead mt-3">No tracks found matching your criteria.</p>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
