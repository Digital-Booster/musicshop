<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Customer Invoices - Music Shop</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/site.css}" />
</head>
<body class="d-flex flex-column min-vh-100">
    <div th:replace="~{fragments/menu :: menu}"></div>
    
    <div class="container flex-grow-1 py-4">
        <div class="content-card">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h1 class="h3 mb-2">
                        <i class="bi bi-receipt me-2"></i>Your Invoices
                    </h1>
                    <p class="text-muted mb-0">
                        Invoices for <strong th:text="${customer.firstName} + ' ' + ${customer.lastName}">Customer</strong>
                    </p>
                </div>
                <div class="text-end">
                    <div class="alert alert-info mb-0 d-inline-flex align-items-center py-2">
                        <i class="bi bi-cash me-2"></i>
                        <strong>Total: </strong>
                        <span class="ms-2" th:text="${total}">0.00</span>
                    </div>
                </div>
            </div>

            <div th:if="${error}" class="alert alert-danger d-flex align-items-center" role="alert">
                <i class="bi bi-exclamation-circle me-2"></i>
                <div th:text="${error}"></div>
            </div>

            <div th:if="${invoices != null and #lists.isEmpty(invoices) == false}">
                <div class="accordion" id="invoiceAccordion">
                    <div class="accordion-item" th:each="inv, itemStat : ${invoices}">
                        <h2 class="accordion-header">
                            <button class="accordion-button collapsed" type="button" 
                                    data-bs-toggle="collapse" 
                                    th:data-bs-target="'#invoice-' + ${inv.invoiceId}"
                                    th:aria-controls="'invoice-' + ${inv.invoiceId}">
                                <div class="d-flex align-items-center justify-content-between w-100">
                                    <div>
                                        <i class="bi bi-receipt me-2"></i>
                                        Invoice #<span th:text="${inv.invoiceId}"></span>
                                    </div>
                                    <div class="ms-4">
                                        <span class="badge bg-secondary me-2" th:text="${inv.invoiceDate}"></span>
                                        <span class="badge bg-primary" th:text="'$' + ${inv.total}"></span>
                                    </div>
                                </div>
                            </button>
                        </h2>
                        <div th:id="'invoice-' + ${inv.invoiceId}" class="accordion-collapse collapse"
                             data-bs-parent="#invoiceAccordion">
                            <div class="accordion-body">
                                <div class="table-responsive">
                                    <table class="table table-hover align-middle mb-0">
                                        <thead class="table-light">
                                            <tr>
                                                <th>Track</th>
                                                <th class="text-center">Quantity</th>
                                                <th class="text-end">Unit Price</th>
                                                <th class="text-end">Total</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr th:each="item : ${inv.invoiceItems}">
                                                <td>
                                                    <i class="bi bi-music-note me-2"></i>
                                                    <span th:text="${item.track != null ? item.track.name : 'Unknown'}">Track Name</span>
                                                </td>
                                                <td class="text-center" th:text="${item.quantity}">1</td>
                                                <td class="text-end" th:text="'$' + ${item.unitPrice}">0.00</td>
                                                <td class="text-end" th:text="'$' + ${item.quantity * item.unitPrice}">0.00</td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div th:if="${invoices == null || #lists.isEmpty(invoices)}" class="text-center py-5">
                <i class="bi bi-receipt-cutoff display-1 text-muted"></i>
                <p class="lead mt-3">No invoices found for this customer.</p>
            </div>

            <div class="mt-4">
                <a th:href="@{/}" class="btn btn-outline-secondary">
                    <i class="bi bi-arrow-left me-2"></i>Back
                </a>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
