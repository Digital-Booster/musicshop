<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Edit User - Music Shop</title>
    <link rel="stylesheet" th:href="@{/css/site.css}" />
    </head>
<body>
<div class="container edit">
    <div th:replace="fragments/menu :: menu"></div>
    <h2>Edit User</h2>

    <div th:if="${error}" style="color:#b00020;">[[${error}]]</div>
    <div th:if="${message}" style="color:#2e7d32;">[[${message}]]</div>

    <form th:action="@{/admin/users/{id}(id=${appUser.userId})}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

        <label>Username</label>
        <input type="text" name="username" th:value="${appUser.username}" disabled />

        <label>Role</label>
        <input type="text" name="role" th:value="${appUser.role}" />

        <h3>Customer info</h3>
        <label for="firstName">First name</label>
        <input id="firstName" name="firstName" type="text" th:value="${customer.firstName}" />

        <label for="lastName">Last name</label>
        <input id="lastName" name="lastName" type="text" th:value="${customer.lastName}" />

        <label for="email">Email</label>
        <input id="email" name="email" type="text" th:value="${customer.email}" />

        <label for="company">Company</label>
        <input id="company" name="company" type="text" th:value="${customer.company}" />

        <label for="address">Address</label>
        <input id="address" name="address" type="text" th:value="${customer.address}" />

        <label for="city">City</label>
        <input id="city" name="city" type="text" th:value="${customer.city}" />

        <label for="state">State</label>
        <input id="state" name="state" type="text" th:value="${customer.state}" />

        <label for="country">Country</label>
        <input id="country" name="country" type="text" th:value="${customer.country}" />

        <label for="postalCode">Postal Code</label>
        <input id="postalCode" name="postalCode" type="text" th:value="${customer.postalCode}" />

        <label for="phone">Phone</label>
        <input id="phone" name="phone" type="text" th:value="${customer.phone}" />

        <label for="fax">Fax</label>
        <input id="fax" name="fax" type="text" th:value="${customer.fax}" />

        <div>
            <button type="submit">Save</button>
            <a th:href="@{/admin/users}">Back</a>
        </div>
    </form>

    <form th:action="@{/admin/users/{id}/delete(id=${appUser.userId})}" method="post" style="margin-top:16px;">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <button type="submit" class="danger">Delete user</button>
    </form>
</div>
</body>
</html>
