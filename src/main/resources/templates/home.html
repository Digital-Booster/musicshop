<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8" />
    <title>Home - Music Shop</title>
    <style>
        body { font-family: Arial, Helvetica, sans-serif; background:#f6f6f6; margin:0; }
        .container { width: 800px; margin:40px auto; background: #fff; padding:20px; box-shadow:0 2px 6px rgba(0,0,0,.1); }
        .topnav { display:flex; gap:12px; align-items:center; justify-content:space-between; margin-bottom:16px; }
        .menu { display:flex; gap:10px; list-style:none; padding:0; margin:0; }
        .menu li a { text-decoration:none; padding:8px 12px; display:block; color:#333; border-radius:4px; }
        .menu li a:hover { background:#f0f0f0; }
        @media (max-width:600px) {
            .container { width: calc(100% - 24px); margin:16px; }
            .menu { flex-wrap:wrap; }
        }
    </style>
</head>
<body>
<div class="container">
    <div th:replace="fragments/menu :: menu"></div>
    <h2>Welcome</h2>
    <p>Welcome to the Music Shop.</p>

    <!-- show logged-in user name; uses servlet request remoteUser which works with container-managed auth -->
    <p th:if="${username != null}">Logged in as: <strong th:text="${username}">user</strong></p>
    <p th:if="${username == null}">You are not logged in. <a th:href="@{/login}">Login</a></p>

    <!-- logout link: default Spring Security logout endpoint is /logout (POST). Provide form to POST logout -->
    <form th:action="@{/logout}" method="post" th:if="${username != null}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <button type="submit">Logout</button>
    </form>
</div>
</body>
</html>
