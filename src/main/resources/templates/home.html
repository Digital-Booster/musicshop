<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home - Music Shop</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/site.css}" />
</head>
<body class="d-flex flex-column min-vh-100">
    <div th:replace="~{fragments/menu :: menu}"></div>
    
    <div class="container flex-grow-1 py-4">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="content-card text-center">
                    <div class="mb-4">
                        <i class="bi bi-music-note-beamed display-1 text-primary"></i>
                        <h1 class="h2 mt-3">Welcome to Music Shop</h1>
                        <p class="lead text-muted">Your one-stop destination for all things music</p>
                    </div>

                    <div th:if="${username == null}" class="alert alert-info d-inline-flex align-items-center mx-auto">
                        <i class="bi bi-info-circle me-2"></i>
                        You are not logged in. 
                        <a th:href="@{/login}" class="ms-2 btn btn-primary btn-sm">
                            <i class="bi bi-box-arrow-in-right me-1"></i>Login
                        </a>
                    </div>

                    <div th:if="${username != null}" class="alert alert-success d-inline-flex align-items-center">
                        <i class="bi bi-person-check me-2"></i>
                        Welcome back, <strong class="mx-1" th:text="${username}">user</strong>!
                    </div>
                </div>

                <!-- Featured Section -->
                <div class="row mt-4 g-4">
                    <div class="col-md-6">
                        <div class="content-card h-100">
                            <div class="text-center mb-3">
                                <a th:href="@{/catalog}" class="text-decoration-none text-dark">
                                <i class="bi bi-collection-play display-4 text-primary"></i>
                                </a>
                            </div>
                                <a th:href="@{/catalog}" class="text-decoration-none text-dark">
                                    <h3 class="h4 text-center">Browse Catalog</h3>
                                    <p class="text-muted text-center">Explore our vast collection of music and find your next favorite track.</p>
                                </a>
                            
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="content-card h-100">
                            <div class="text-center mb-3">
                                <i class="bi bi-star display-4 text-primary"></i>
                            </div>
                            <h3 class="h4 text-center">Featured Items</h3>
                            <p class="text-muted text-center">Check out our featured items and special deals.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
