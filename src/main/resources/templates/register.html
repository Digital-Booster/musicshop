<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - Music Shop</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/site.css}" />
</head>
<body class="d-flex flex-column min-vh-100">
    <div th:replace="~{fragments/menu :: menu}"></div>
    
    <div class="container flex-grow-1">
        <div class="auth-container">
            <div class="text-center mb-4">
                <h1 class="h3">Create an Account</h1>
                <p class="text-muted">Join Music Shop and start shopping</p>
            </div>

            <!-- Show error message if exists -->
            <div th:if="${error}" class="alert alert-danger d-flex align-items-center" role="alert">
                <i class="bi bi-exclamation-circle me-2"></i>
                <div th:text="${error}"></div>
            </div>
            <div th:if="${message}" class="alert alert-success d-flex align-items-center" role="alert">
                <i class="bi bi-check-circle me-2"></i>
                <div th:text="${message}"></div>
            </div>

            <!-- Registration form -->
            <form th:action="@{/register}" method="post" class="needs-validation" novalidate>
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                
                <div class="row g-3">
                    <div class="col-md-6">
                        <div class="form-floating">
                            <input id="firstName" name="firstName" type="text" class="form-control" 
                                   placeholder="First name" required th:value="${firstName}" />
                            <label for="firstName">First name</label>
                            <div class="invalid-feedback">Please provide your first name.</div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-floating">
                            <input id="lastName" name="lastName" type="text" class="form-control" 
                                   placeholder="Last name" required th:value="${lastName}" />
                            <label for="lastName">Last name</label>
                            <div class="invalid-feedback">Please provide your last name.</div>
                        </div>
                    </div>
                </div>

                <div class="form-floating mt-3">
                    <input id="email" name="email" type="email" class="form-control" 
                           placeholder="Email" required th:value="${email}" />
                    <label for="email">Email (will be your username)</label>
                    <div class="invalid-feedback">Please provide a valid email address.</div>
                </div>

                <div class="form-floating mt-3">
                    <input id="password" name="password" type="password" class="form-control" 
                           placeholder="Password" required minlength="8" />
                    <label for="password">Password</label>
                    <div class="invalid-feedback">Please provide a password (minimum 8 characters).</div>
                </div>
                <div class="form-floating mt-3">
                    <input id="confirmPassword" name="confirmPassword" type="password" class="form-control" 
                           placeholder="Confirm Password" required />
                    <label for="confirmPassword">Confirm Password</label>
                    <div class="invalid-feedback" id="confirmPasswordInvalidFeedback">Passwords do not match.</div>
                </div>
                <!-- Password strength meter (client-only) -->
                <div class="mt-2">
                    <div class="progress" style="height: 8px;">
                        <div id="passwordStrengthBar" class="progress-bar" role="progressbar" style="width: 0%"
                             aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
                    </div>
                    <small id="passwordStrengthText" class="form-text text-muted">Password strength: <span>Too short</span></small>
                </div>

                <div class="mt-4">
                    <p class="section-title mb-3">Additional Information</p>
                    <div class="row g-3">
                        <div class="col-12">
                            <div class="form-floating">
                                <input id="company" name="company" type="text" class="form-control" 
                                       placeholder="Company" th:value="${company}" />
                                <label for="company">Company</label>
                            </div>
                        </div>

                        <div class="col-12">
                            <div class="form-floating">
                                <input id="address" name="address" type="text" class="form-control" 
                                       placeholder="Address" th:value="${address}" />
                                <label for="address">Address</label>
                            </div>
                        </div>

                        <div class="col-md-6">
                            <div class="form-floating">
                                <input id="city" name="city" type="text" class="form-control" 
                                       placeholder="City" th:value="${city}" />
                                <label for="city">City</label>
                            </div>
                        </div>

                        <div class="col-md-6">
                            <div class="form-floating">
                                <input id="state" name="state" type="text" class="form-control" 
                                       placeholder="State" th:value="${state}" />
                                <label for="state">State</label>
                            </div>
                        </div>

                        <div class="col-md-6">
                            <div class="form-floating">
                                <input id="country" name="country" type="text" class="form-control" 
                                       placeholder="Country" th:value="${country}" />
                                <label for="country">Country</label>
                            </div>
                        </div>

                        <div class="col-md-6">
                            <div class="form-floating">
                                <input id="postalCode" name="postalCode" type="text" class="form-control" 
                                       placeholder="Postal Code" th:value="${postalCode}" />
                                <label for="postalCode">Postal Code</label>
                            </div>
                        </div>

                        <div class="col-md-6">
                            <div class="form-floating">
                                <input id="phone" name="phone" type="tel" class="form-control" 
                                       placeholder="Phone" th:value="${phone}" />
                                <label for="phone">Phone</label>
                            </div>
                        </div>

                        <div class="col-md-6">
                            <div class="form-floating">
                                <input id="fax" name="fax" type="tel" class="form-control" 
                                       placeholder="Fax" th:value="${fax}" />
                                <label for="fax">Fax</label>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="d-grid gap-2 mt-4">
                    <button type="submit" class="btn btn-primary py-2">
                        <i class="bi bi-person-plus me-2"></i>Create Account
                    </button>
                    <a th:href="@{/login}" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left me-2"></i>Back to Login
                    </a>
                </div>
            </form>
        </div>
    </div>

    <!-- Client-side validation (Bootstrap) -->
    <script>
        (function () {
            'use strict'

            var forms = document.querySelectorAll('.needs-validation')

            Array.prototype.slice.call(forms)
                .forEach(function (form) {
                    form.addEventListener('submit', function (event) {
                        if (!form.checkValidity()) {
                            event.preventDefault()
                            event.stopPropagation()
                        }
                        form.classList.add('was-validated')
                    }, false)
                })

            // Password strength meter
            var pwd = document.getElementById('password')
            var bar = document.getElementById('passwordStrengthBar')
            var text = document.getElementById('passwordStrengthText')
            var confirmPwd = document.getElementById('confirmPassword')
            var confirmPwdFeedback = document.getElementById('confirmPasswordInvalidFeedback')

            if (pwd && confirmPwd && bar && text) {
                // Add an event listener to the form to validate on submit
                forms.forEach(function (form) {
                    form.addEventListener('submit', function (event) {
                        if (pwd.value !== confirmPwd.value) {
                            event.preventDefault()
                            event.stopPropagation()
                            confirmPwd.classList.add('is-invalid')
                        } else {
                            confirmPwd.classList.remove('is-invalid')
                        }
                    }, false)
                })

                // Add event listener to confirmPassword for real-time feedback
                confirmPwd.addEventListener('input', function () {
                    if (pwd.value !== confirmPwd.value) {
                        confirmPwd.classList.add('is-invalid')
                    } else {
                        confirmPwd.classList.remove('is-invalid')
                    }
                })

                // Add event listener to password for real-time feedback when confirmPassword is also filled
                pwd.addEventListener('input', function () {
                    if (confirmPwd.value !== '') {
                        if (pwd.value !== confirmPwd.value) {
                            confirmPwd.classList.add('is-invalid')
                        } else {
                            confirmPwd.classList.remove('is-invalid')
                        }
                    }
                    // Password strength meter logic remains the same
                    var val = pwd.value || ''
                    var score = 0

                    // length
                    if (val.length >= 8) score += 1
                    if (val.length >= 12) score += 1

                    // variety
                    if (/[A-Z]/.test(val)) score += 1
                    if (/[0-9]/.test(val)) score += 1
                    if (/[^A-Za-z0-9]/.test(val)) score += 1

                    var percent = Math.min(100, (score / 5) * 100)
                    bar.style.width = percent + '%'
                    bar.setAttribute('aria-valuenow', percent)

                    var label = 'Too short'
                    var cls = 'bg-danger'
                    if (val.length === 0) {
                        label = 'Too short'
                        cls = 'bg-danger'
                    } else if (percent < 40) {
                        label = 'Weak'
                        cls = 'bg-danger'
                    } else if (percent < 80) {
                        label = 'Good'
                        cls = 'bg-warning'
                    } else {
                        label = 'Strong'
                        cls = 'bg-success'
                    }

                    // update classes
                    bar.className = 'progress-bar ' + cls
                    text.querySelector('span').textContent = label
                })
            }
        })()
    </script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
