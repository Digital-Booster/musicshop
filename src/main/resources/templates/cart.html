<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shopping Cart - Music Shop</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/site.css}" />
</head>
<body class="d-flex flex-column min-vh-100">
    <div th:replace="~{fragments/menu :: menu}"></div>
    
    <div class="container flex-grow-1 py-4">
        <div class="content-card">
            <h1 class="h3 mb-4"><i class="bi bi-cart me-2"></i>Shopping Cart</h1>

            <div th:if="${cart.cartItems == null or #lists.isEmpty(cart.cartItems)}">
                <div class="text-center py-5">
                    <i class="bi bi-cart-x display-1 text-muted"></i>
                    <p class="lead mt-3">Your cart is empty.</p>
                    <a th:href="@{/catalog}" class="btn btn-primary mt-3">
                        <i class="bi bi-music-note-list me-2"></i>Continue Shopping
                    </a>
                </div>
            </div>

            <div th:if="${cart.cartItems != null and not #lists.isEmpty(cart.cartItems)}">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>Track</th>
                                <th>Album</th>
                                <th>Artist</th>
                                <th class="text-center">Quantity</th>
                                <th class="text-end">Unit Price</th>
                                <th class="text-end">Total</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="item : ${cart.cartItems}">
                                <td>
                                    <i class="bi bi-music-note me-2"></i>
                                    <span th:text="${item.track.name}">Track Name</span>
                                </td>
                                <td>
                                    <i class="bi bi-disc me-2"></i>
                                    <span th:text="${item.track.album.title}">Album Title</span>
                                </td>
                                <td>
                                    <i class="bi bi-person me-2"></i>
                                    <span th:text="${item.track.album.artist.name}">Artist Name</span>
                                </td>
                                <td class="text-center" th:text="${item.quantity}">1</td>
                                <td class="text-end" th:text="'$' + ${item.unitPrice}">0.00</td>
                                <td class="text-end" th:text="'$' + ${item.unitPrice.multiply(item.quantity)}">0.00</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div class="d-flex justify-content-end align-items-center mt-4">
                    <h3 class="me-4">Total: <span class="text-primary" th:text="'$' + ${cart.total}">$0.00</span></h3>
                    <button class="btn btn-lg btn-success">
                        <i class="bi bi-check-circle me-2"></i>Confirm Order
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
