<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile - Music Shop</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/site.css}" />
</head>
<body class="d-flex flex-column min-vh-100">
    <div th:replace="~{fragments/menu :: menu}"></div>
    
    <div class="container flex-grow-1 py-4">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="profile-section">
                    <h1 class="h3 mb-4">Your Profile</h1>

                    <div th:if="${error}" class="alert alert-danger d-flex align-items-center" role="alert">
                        <i class="bi bi-exclamation-circle me-2"></i>
                        <div th:text="${error}"></div>
                    </div>
                    <div th:if="${message}" class="alert alert-success d-flex align-items-center" role="alert">
                        <i class="bi bi-check-circle me-2"></i>
                        <div th:text="${message}"></div>
                    </div>

                    <form th:action="@{/profile}" method="post" class="needs-validation" novalidate>
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                        <!-- Personal Information -->
                        <div class="profile-section-title">Personal Information</div>
                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                    <label for="firstName" class="form-label">First name</label>
                    <input id="firstName" name="firstName" type="text" class="form-control" 
                        required th:value="${firstName}" />
                    <div class="invalid-feedback">Please provide your first name.</div>
                            </div>
                            <div class="col-md-6">
                    <label for="lastName" class="form-label">Last name</label>
                    <input id="lastName" name="lastName" type="text" class="form-control" 
                        required th:value="${lastName}" />
                    <div class="invalid-feedback">Please provide your last name.</div>
                            </div>
                            <div class="col-12">
                    <label for="email" class="form-label">Email</label>
                    <input id="email" name="email" type="email" class="form-control" 
                        required th:value="${email}" />
                    <div class="invalid-feedback">Please provide a valid email address.</div>
                            </div>
                        </div>

                        <!-- Company Information -->
                        <div class="profile-section-title">Company Information</div>
                        <div class="row g-3 mb-4">
                            <div class="col-12">
                                <label for="company" class="form-label">Company</label>
                                <input id="company" name="company" type="text" class="form-control" 
                                       th:value="${company}" />
                            </div>
                        </div>

                        <!-- Address Information -->
                        <div class="profile-section-title">Address</div>
                        <div class="row g-3 mb-4">
                            <div class="col-12">
                                <label for="address" class="form-label">Street Address</label>
                                <input id="address" name="address" type="text" class="form-control" 
                                       th:value="${address}" />
                            </div>
                            <div class="col-md-6">
                                <label for="city" class="form-label">City</label>
                                <input id="city" name="city" type="text" class="form-control" 
                                       th:value="${city}" />
                            </div>
                            <div class="col-md-6">
                                <label for="state" class="form-label">State</label>
                                <input id="state" name="state" type="text" class="form-control" 
                                       th:value="${state}" />
                            </div>
                            <div class="col-md-6">
                                <label for="country" class="form-label">Country</label>
                                <input id="country" name="country" type="text" class="form-control" 
                                       th:value="${country}" />
                            </div>
                            <div class="col-md-6">
                                <label for="postalCode" class="form-label">Postal Code</label>
                                <input id="postalCode" name="postalCode" type="text" class="form-control" 
                                       th:value="${postalCode}" />
                            </div>
                        </div>

                        <!-- Contact Information -->
                        <div class="profile-section-title">Contact Information</div>
                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label for="phone" class="form-label">Phone</label>
                                <input id="phone" name="phone" type="tel" class="form-control" 
                                       th:value="${phone}" />
                            </div>
                            <div class="col-md-6">
                                <label for="fax" class="form-label">Fax</label>
                                <input id="fax" name="fax" type="tel" class="form-control" 
                                       th:value="${fax}" />
                            </div>
                        </div>

                        <div class="d-flex gap-2 pt-3">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-save me-2"></i>Save Changes
                            </button>
                            <a th:href="@{/}" class="btn btn-outline-secondary">
                                <i class="bi bi-arrow-left me-2"></i>Back
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Client-side validation (Bootstrap) -->
    <script>
        (function () {
            'use strict'
            var forms = document.querySelectorAll('.needs-validation')
            Array.prototype.slice.call(forms)
                .forEach(function (form) {
                    form.addEventListener('submit', function (event) {
                        if (!form.checkValidity()) {
                            event.preventDefault()
                            event.stopPropagation()
                        }
                        form.classList.add('was-validated')
                    }, false)
                })
        })()
    </script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
