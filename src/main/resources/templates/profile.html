<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Profile - Music Shop</title>
    <link rel="stylesheet" th:href="@{/css/site.css}" />
    </head>
<body>
<div class="container">
    <div th:replace="fragments/menu :: menu"></div>
    <h2>Your profile</h2>

    <div th:if="${error}" class="error" th:text="${error}"></div>
    <div th:if="${message}" class="message" th:text="${message}"></div>

    <form th:action="@{/profile}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

        <label for="firstName">First name</label>
        <input id="firstName" name="firstName" type="text" required th:value="${firstName}" />

        <label for="lastName">Last name</label>
        <input id="lastName" name="lastName" type="text" required th:value="${lastName}" />

        <label for="email">Email</label>
        <input id="email" name="email" type="email" required th:value="${email}" />

        <label for="company">Company</label>
        <input id="company" name="company" type="text" th:value="${company}" />

        <label for="address">Address</label>
        <input id="address" name="address" type="text" th:value="${address}" />

        <label for="city">City</label>
        <input id="city" name="city" type="text" th:value="${city}" />

        <label for="state">State</label>
        <input id="state" name="state" type="text" th:value="${state}" />

        <label for="country">Country</label>
        <input id="country" name="country" type="text" th:value="${country}" />

        <label for="postalCode">Postal Code</label>
        <input id="postalCode" name="postalCode" type="text" th:value="${postalCode}" />

        <label for="phone">Phone</label>
        <input id="phone" name="phone" type="text" th:value="${phone}" />

        <label for="fax">Fax</label>
        <input id="fax" name="fax" type="text" th:value="${fax}" />

        <div>
            <button type="submit">Save</button>
            <a th:href="@{/}">Back</a>
        </div>
    </form>
</div>
</body>
</html>
