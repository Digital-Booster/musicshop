<!DOCTYPE html>
<!-- Shared navigation fragment -->
<div xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:fragment="menu">
    <style>
        .topnav { display:flex; gap:12px; align-items:center; justify-content:space-between; margin-bottom:16px; }
        .menu { display:flex; gap:10px; list-style:none; padding:0; margin:0; }
        .menu li a { text-decoration:none; padding:8px 12px; display:block; color:#333; border-radius:4px; }
        .menu li a:hover { background:#f0f0f0; }
        .username { font-size:0.9rem; color:#555; margin-right:8px; }
        @media (max-width:600px) {
            .menu { flex-wrap:wrap; }
        }
    </style>

    <div class="topnav">
        <div>
            <strong>Music Shop</strong>
        </div>

        <div style="display:flex; align-items:center; gap:12px;">
            <ul class="menu">
                <li sec:authorize="isAuthenticated()"><a th:href="@{/}">Home</a></li>
                <li sec:authorize="hasRole('USER')"><a th:href="@{/profile}">Profile</a></li>
                <li sec:authorize="hasRole('USER')"><a th:href="@{/invoices}">Invoices</a></li>
                <li sec:authorize="hasRole('ADMIN')"><a th:href="@{/admin/users}">Users</a></li>
                <li sec:authorize="hasRole('ADMIN')"><a th:href="@{/invoices}">Invoices</a></li>
                <li sec:authorize="!isAuthenticated()"><a th:href="@{/login}">Login</a></li>
                <li sec:authorize="!isAuthenticated()"><a th:href="@{/register}">Register</a></li>
            </ul>

            <div sec:authorize="isAuthenticated()" style="display:flex; align-items:center; gap:8px;">
                <span class="username">User: <strong th:text="${#authentication.name}">user</strong></span>
                <form th:action="@{/logout}" method="post" style="margin:0;">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <button type="submit">Logout</button>
                </form>
            </div>
        </div>
    </div>
</div>
