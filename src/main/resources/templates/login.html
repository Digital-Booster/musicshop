<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Login - Music Shop</title>
    <link rel="stylesheet" th:href="@{/css/site.css}" />
</head>
<body>
<div class="container small">
    <div th:replace="fragments/menu :: menu"></div>
    <h2>Sign in</h2>

    <!-- Spring Security default login processing URL is /login (POST) -->
    <form th:action="@{/login}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autofocus />

        <label for="password">Password</label>
        <input id="password" name="password" type="password" />

        <div>
            <button type="submit">Login</button>
        </div>

        <!-- show messages -->
        <div th:if="${param.error}" class="error">Invalid username or password.</div>
        <div th:if="${param.logout}" class="success">You have been logged out.</div>
        <div th:if="${message}" class="success" th:text="${message}"></div>
    </form>

    <p style="margin-top:12px;">Don't have an account? <a th:href="@{/register}">Register</a></p>
</div>
</body>
</html>
