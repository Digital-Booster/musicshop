<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Music Shop</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/site.css}" />
</head>
<body class="d-flex flex-column min-vh-100">
    <div th:replace="~{fragments/menu :: menu}"></div>
    
    <div class="container flex-grow-1">
        <div class="auth-container">
            <div class="text-center mb-4">
                <h1 class="h3">Welcome Back</h1>
                <p class="text-muted">Sign in to your account</p>
            </div>

            <!-- Spring Security default login processing URL is /login (POST) -->
            <form th:action="@{/login}" method="post" class="needs-validation" novalidate>
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                
                <div class="form-floating mb-3">
                    <input id="username" name="username" type="text" class="form-control" placeholder="Username" required autofocus />
                    <label for="username">Username</label>
                    <div class="invalid-feedback">Please enter your username.</div>
                </div>

                <div class="form-floating mb-4">
                    <input id="password" name="password" type="password" class="form-control" placeholder="Password" required />
                    <label for="password">Password</label>
                    <div class="invalid-feedback">Please enter your password.</div>
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-primary py-2">Sign In</button>
                </div>

                <!-- show messages -->
                <div th:if="${param.error}" class="alert alert-danger mt-3" role="alert">
                    <i class="bi bi-exclamation-circle me-2"></i>Invalid username or password.
                </div>
                <div th:if="${param.logout}" class="alert alert-success mt-3" role="alert">
                    <i class="bi bi-check-circle me-2"></i>You have been logged out.
                </div>
                <div th:if="${message}" class="alert alert-success mt-3" role="alert">
                    <i class="bi bi-check-circle me-2"></i><span th:text="${message}"></span>
                </div>

                <div class="text-center mt-4">
                    <span class="text-muted">Don't have an account?</span>
                    <a th:href="@{/register}" class="ms-1">Register here</a>
                </div>
            </form>
        </div>
    </div>

    <!-- Client-side validation (Bootstrap) -->
    <script>
        (function () {
            'use strict'
            var forms = document.querySelectorAll('.needs-validation')
            Array.prototype.slice.call(forms)
                .forEach(function (form) {
                    form.addEventListener('submit', function (event) {
                        if (!form.checkValidity()) {
                            event.preventDefault()
                            event.stopPropagation()
                        }
                        form.classList.add('was-validated')
                    }, false)
                })
        })()
    </script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
